name: Deploy Infra

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_VAR_mainServer: ${{ secrets.MAIN_SERVER_URL }}
      TF_VAR_orchestrator: ${{ secrets.ORCHESTRATOR_URL }}
      TF_VAR_voicePipeline: ${{ secrets.VOICE_PIPELINE_URL }}
      TF_VAR_otherServicesIP: ${{ secrets.OTHER_SERVICES_IP }}
      TF_VAR_homeAssistantIP: ${{ secrets.HOME_ASSISTANT_IP }}
      TF_VAR_networkGateway: ${{ secrets.NETWORK_GATEWAY }}

      TF_VAR_adminUser: ${{ secrets.ADMIN_USER }}
      TF_VAR_adminEmail: ${{ secrets.ADMIN_EMAIL }}
      TF_VAR_adminPassword: ${{ secrets.ADMIN_PASSWORD }}

      TF_VAR_tailscaleSecret: ${{ secrets.TAILSCALE_API_KEY }}
      TF_VAR_tailnet: ${{ secrets.TAILNET }}
      TF_VAR_gDriveAuthID: ${{ secrets.GDRIVE_AUTH_ID }}

      TF_VAR_tailscaleOrchestratorAuthKey: ${{ secrets.TAILSCALE_ORCHESTRATOR_AUTH_KEY }}
      TF_VAR_tailscaleMainAuthKey: ${{ secrets.TAILSCALE_MAIN_AUTH_KEY }}
      TF_VAR_tailscaleVoiceAuthKey: ${{ secrets.TAILSCALE_VOICE_AUTH_KEY }}

      TF_VAR_mainKey: "secrets."
      TF_VAR_mainKeyPublic: ""
      TF_VAR_orchestratorKey: ""
      TF_VAR_orchestratorKeyPublic: ""
      TF_VAR_voiceKey: ""
      TF_VAR_voiceKeyPublic: ""
      TF_VAR_otherServicesKey: ""
      TF_VAR_otherServicesKeyPublic: ""
      TF_VAR_homeAssistantKey: ""
      TF_VAR_homeAssistantKeyPublic: ""

      TF_VAR_proxmoxAPI: ${{ secrets.PROXMOX_API_URL }}
      TF_VAR_proxmoxTokenId: ${{ secrets.PROXMOX_TOKEN_ID }}
      TF_VAR_proxmoxSecret: ${{ secrets.PROXMOX_SECRET }}
      TF_VAR_haosTemplate: ${{ vars.HAOS_TEMPLATE }}
      TF_VAR_ezbkTemplate: ${{ vars.EZBK_TEMPLATE }}
      TF_VAR_homeAssistantUSB: ${{ vars.HOME_ASSISTANT_USB }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15
          cli_config_credentials_token: ${{ secrets.TERRAFORM_API_TOKEN }}

      # 1. Connect to your Tailnet to access private nodes
      - name: Connect to Tailnet
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      # 2. Layer 1: Infrastructure Deployment
      - name: Terraform Init & Apply (Layer 1 - Infra)
        run: |
          terraform -chdir="layers/1- Infra" init
          terraform -chdir="layers/1- Infra" plan -out=infra.tfplan -input=false
          terraform -chdir="layers/1- Infra" apply -auto-approve -input=false infra.tfplan 2>&1 > infra_apply.log

      # 3. Layer 2: Services Deployment
      - name: Reconcile Docker State (Layer 2 - Services)
        run: |
          echo "Reconciling legacy containers..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.ADMIN_USER }}@${{ secrets.OTHER_SERVICES_IP }} "docker rm -f ezbookkeeping || true" 2>/dev/null || true

      - name: Terraform Init & Apply (Layer 2 - Services)
        run: |
          terraform -chdir="layers/2 - Services" init
          terraform -chdir="layers/2 - Services" plan -out=services.tfplan -input=false
          terraform -chdir="layers/2 - Services" apply -auto-approve -input=false services.tfplan 2>&1 > services_apply.log

      # 4. Capture Failure Logs
      - name: Capture Failure Logs
        if: failure()
        run: |
          echo "=== LAYER 1 ERROR LOG ===" > error_log.txt
          tail -n 250 infra_apply.log >> error_log.txt 2>/dev/null || true
          echo "=== LAYER 2 ERROR LOG ===" >> error_log.txt
          tail -n 250 services_apply.log >> error_log.txt 2>/dev/null || true
          {
            echo 'TF_APPLY_ERROR<<EOF'
            tail -n 30 error_log.txt
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Upload Error Log
        id: artifact-upload
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-error-log
          path: error_log.txt

      # 5. Observability: Send messages to Discord
      - name: Send success message to discord
        if: success()
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: "Multi-layer infrastructure deployment applied successfully! ✅ (Layers 1 & 2 complete)"

      - name: Send failure message to discord
        if: failure()
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            **Multi-layer Infrastructure Deployment FAILED** ❌
            [View Full Error Log](${{ steps.artifact-upload.outputs.artifact-url }})

      # 6. Logout from Tailnet
      - name: Logout from Tailnet
        run: sudo tailscale logout
