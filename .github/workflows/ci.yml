name: ci
on:
  pull_request:
    branches: [ main ]

jobs:
  createplan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Connect to your Tailnet to access private nodes
      - name: Connect to Tailnet
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15
          cli_config_credentials_token: ${{ secrets.TERRAFORM_API_TOKEN }}

      # 3. Layer 1: Infrastructure Operations
      - name: Terraform Init (Layer 1 - Infra)
        run: terraform -chdir="layers/1- Infra" init

      - name: Terraform Format (Layer 1 - Infra)
        run: terraform -chdir="layers/1- Infra" fmt -check

      - name: Import Tailscale Policy (Layer 1 - Infra)
        env:
          TF_VAR_tailscaleSecret: ${{ secrets.TAILSCALE_API_KEY }}
          TF_VAR_tailnet: ${{ secrets.TAILNET }}
        run: terraform -chdir="layers/1- Infra" import tailscale_acl.home_mesh_policy home_mesh_policy || true

      - name: Terraform Plan (Layer 1 - Infra)
        id: plan_infra
        env:
          TF_VAR_mainServer: ${{ secrets.MAIN_SERVER_URL }}
          TF_VAR_orchestrator: ${{ secrets.ORCHESTRATOR_URL }}
          TF_VAR_voicePipeline: ${{ secrets.VOICE_PIPELINE_URL }}
          TF_VAR_otherServicesIP: ${{ secrets.OTHER_SERVICES_IP }}
          TF_VAR_homeAssistantIP: ${{ secrets.HOME_ASSISTANT_IP }}
          TF_VAR_networkGateway: ${{ secrets.NETWORK_GATEWAY }}

          TF_VAR_adminUser: ${{ secrets.ADMIN_USER }}
          TF_VAR_adminEmail: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_adminPassword: ${{ secrets.ADMIN_PASSWORD }}

          TF_VAR_tailscaleSecret: ${{ secrets.TAILSCALE_API_KEY }}
          TF_VAR_tailnet: ${{ secrets.TAILNET }}
          TF_VAR_gDriveAuthID: ${{ secrets.GDRIVE_AUTH_ID }}

          TF_VAR_tailscaleOrchestratorAuthKey: ${{ secrets.TAILSCALE_ORCHESTRATOR_AUTH_KEY }}
          TF_VAR_tailscaleMainAuthKey: ${{ secrets.TAILSCALE_MAIN_AUTH_KEY }}
          TF_VAR_tailscaleVoiceAuthKey: ${{ secrets.TAILSCALE_VOICE_AUTH_KEY }}

          TF_VAR_mainKey: ""
          TF_VAR_mainKeyPublic: ""
          TF_VAR_orchestratorKey: ""
          TF_VAR_orchestratorKeyPublic: ""
          TF_VAR_voiceKey: ""
          TF_VAR_voiceKeyPublic: ""
          TF_VAR_otherServicesKey: ""
          TF_VAR_otherServicesKeyPublic: ""
          TF_VAR_homeAssistantKey: ""
          TF_VAR_homeAssistantKeyPublic: ""

          TF_VAR_proxmoxAPI: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_proxmoxTokenId: ${{ secrets.PROXMOX_TOKEN_ID }}
          TF_VAR_proxmoxSecret: ${{ secrets.PROXMOX_SECRET }}
          TF_VAR_haosTemplate: ${{ vars.HAOS_TEMPLATE }}
          TF_VAR_ezbkTemplate: ${{ vars.EZBK_TEMPLATE }}
          TF_VAR_homeAssistantUSB: ${{ vars.HOME_ASSISTANT_USB }}
        run: |
          terraform -chdir="layers/1- Infra" plan -out=infra.tfplan -input=false -no-color > "$GITHUB_WORKSPACE/infra_plan.log"

      # 4. Layer 2: Services Operations
      - name: Terraform Init (Layer 2 - Services)
        run: terraform -chdir="layers/2 - Services" init

      - name: Terraform Format (Layer 2 - Services)
        run: terraform -chdir="layers/2 - Services" fmt -check

      - name: Terraform Plan (Layer 2 - Services)
        id: plan_services
        run: |
          terraform -chdir="layers/2 - Services" plan -out=services.tfplan -input=false -no-color > "$GITHUB_WORKSPACE/services_plan.log"

      # 5. Send Combined Plan to PR Comment
      - name: Send combined plan to PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "### Layer 1 (Infra) Plan Output 📝" > pr_plan.txt
          echo "\`\`\`terraform" >> pr_plan.txt
          tail -c 25000 "$GITHUB_WORKSPACE/infra_plan.log" >> pr_plan.txt || true
          echo "\`\`\`" >> pr_plan.txt
          echo "" >> pr_plan.txt
          echo "### Layer 2 (Services) Plan Output 📝" >> pr_plan.txt
          echo "\`\`\`terraform" >> pr_plan.txt
          tail -c 25000 "$GITHUB_WORKSPACE/services_plan.log" >> pr_plan.txt || true
          echo "\`\`\`" >> pr_plan.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file pr_plan.txt

      # 6. Logout from Tailnet
      - name: Logout from Tailnet
        run: sudo tailscale logout
